  <fieldset>
    <div class="card border rounded-2 shadow-none mb-3">
      <div class="card-header bg-theme text-white">
        <h6 class="mb-0">DIC Consent Letter</h6>
      </div>
        <div class="card-body">
          <div class="row justify-content-center">
            <div class="col-12 col-sm-12 col-md-8 col-lg-6">
          <!-- <div class="success-content d-flex align-items-center justify-content-center flex-column mb-3">
                  <img src="assets/img/pending.gif" class="img-fluid" alt="pending" width="200"  />
                  <h3 class="text-warning">Pending</h3>
                    </div> -->
          <div class="success-content d-flex align-items-center justify-content-center flex-column mb-3"
            *ngIf="this.managrData?.applicationStatus=='MANAGER_APPROVAL_2' || this.managrData?.applicationStatus=='PENDING_DIC_CONSENT_APPROVAL'">
            <img src="assets/img/pending.gif" class="img-fluid" alt="pending" width="200" />
            <h3 class="text-warning">Awaiting for DIC Approval</h3>
          </div>
          <div class="success-content d-flex align-items-center justify-content-center flex-column mb-3"
            *ngIf="this.managrData?.applicationStatus=='DIC_APPROVAL' || this.managrData?.applicationStatus=='DIC_CONSENT_APPROVAL' || freeze>currentStep ">
            <img src="assets/img/success.gif" class="img-fluid" alt="success" width="200">
            <h5>Approved</h5>
          </div>
          <div class="reject-content d-flex align-items-center justify-content-center flex-column mb-3 d-none"
            *ngIf="this.managrData?.applicationStatus=='DIC_REJECT' ">
            <img src="assets/img/reject.gif" class="img-fluid" alt="reject" width="200" />
            <h5>Rejected</h5>
            <p><span class=" fw-600">Reason Foe Rejection : </span><span
            class="text-theme">{{this.managrData?.reasonForRejection}}</span></p>
          </div>
          <div class="row justify-content-center"
            *ngIf="this.managrData?.applicationStatus=='DIC_APPROVAL' || this.managrData?.applicationStatus=='DIC_CONSENT_APPROVAL' || freeze>currentStep ">
            <div class="col-12 col-sm-12 col-md-8">
              <div class="d-flex gap-2 justify-content-center">
            <button type="button" (click)="DownloadDic()" class="btn btn-primary flex-grow-1">Download NOC</button>
            <button *ngIf="this.managrData?.dicNocFilePath" (click)="openCreditPreviewModal()" class="btn btn-outline-primary">
              <i class="fa fa-eye"></i>
            </button>
              </div>  </div>
          </div>
          <div class="row mt-3 justify-content-center" *ngIf="freeze<=6">
            <div class="col-12 col-sm-12 col-md-8">
              <div>
                <label for="uploadSanctionLetter" class="form-label text-center fw-600 d-block">Upload DIC Consent Letter
              <span class="text-danger">*</span></label>
                <div class="d-flex justify-content-center gap-2 align-items-center">
              <!-- <input class="form-control" id="uploadSanctionLetter" type="file" (change)="onSanctionLetterSelected($event)"> -->
              <input type="file" class="form-control" id="letterUpload" (change)="onFilesSelected($event)">
              <span *ngIf="this.managrData?.dicNocFilePath" (click)="openCreditPreviewModal()">
                <i class="fa fa-eye"></i>
              </span>
                </div>
                <small *ngIf="this.managrData?.dicNocFilePath" class="text-muted d-block text-center">
                Uploaded file: {{ this.managrData?.dicNocFilePath?.split('/').pop() }}
                </small>
              </div>
            </div>
              </div>
          <!-- Sanction Letter Upload -->
          <!-- <div class="card border rounded-2 shadow-none mb-3 mt-3"  *ngIf="freeze<=6">
            <div class="card-header bg-theme text-white">
              <h6 class="mb-0">Upload DIC Consent Letter</h6>
            </div>
            <div class="card-body">
              
            </div>
          </div> -->
            </div>
          </div>
        </div>  </div>
    <!-- <input type="button" name="previous" class="previous btn btn-secondary float-start" value="Previous"/> -->
    <input type="button" name="next" (click)="Approved()" class="next btn btn-primary float-end" value="Confirm to Next"
      *ngIf="freeze<=6" />
  </fieldset>
<div class="modal fade" [ngClass]="{ 'show d-block': showCreditPreviewModal }" tabindex="-1">

  <div class="modal-dialog modal-lg modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">DIC Consent Letter Preview</h5>
        <button type="button" class="btn-close" (click)="closeCreditPreviewModal()"></button>
      </div>
      <div class="modal-body text-center">
       <img [hidden]="!isImageFile(this.managrData?.dicNocFilePath)"
     [src]="this.managrData?.dicNocFilePath"
     alt="Preview" style="max-width:100%;max-height:400px;">

<iframe [hidden]="isImageFile(this.managrData?.dicNocFilePath)" 
        [src]="safePreviewUrl" 
        style="width:100%;height:400px;" frameborder="0"></iframe>

      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" (click)="closeCreditPreviewModal()">Close</button>
      </div>
    </div>
  </div>
</div>
